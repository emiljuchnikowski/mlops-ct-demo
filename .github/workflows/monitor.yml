# Production monitoring: quality of the production model on the newest labelled data, plus the ratings people
# and the test reviewer gave its predictions in Langfuse. The AUC is read back from Langfuse before deciding.
# Below gates.yaml thresholds it starts ml-pipeline on the same data: continuous training.
# Runs every hour (only while the repository variable MONITOR_SCHEDULE is "on") and by hand.
name: monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      labelled:
        description: "Najnowsze dane z etykietami"
        default: data/incoming/batch_ok.csv
      holdout:
        description: "Zbiór testowy dla ponownego treningu"
        default: data/holdout.csv

concurrency:
  group: ml-registry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # to start ml-pipeline

env:
  # A scheduled run has no inputs: it takes the data from repository variables, or the healthy batch.
  LABELLED: ${{ inputs.labelled || vars.MONITOR_LABELLED || 'data/incoming/batch_ok.csv' }}
  RETRAIN_HOLDOUT: ${{ inputs.holdout || vars.MONITOR_HOLDOUT || 'data/holdout.csv' }}
  MONITOR_TRIGGER: ${{ github.event_name }}
  MLPIPE_REGISTRY: ~/mlops-ct-demo/registry
  LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  production-quality:
    if: github.event_name != 'schedule' || vars.MONITOR_SCHEDULE == 'on'
    runs-on: [self-hosted, ai-os-server]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci_env.sh
      - run: test -f ~/mlops-ct-demo/registry/production.json || $PY -m mlpipe bootstrap
      - id: check
        name: Jakość modelu i oceny predykcji (z Langfuse)
        run: $PY -m mlpipe monitor "$LABELLED"
      - name: Ponowny trening, gdy AUC albo oceny spadły poniżej progu
        if: steps.check.outputs.retrain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: "monitor (${{ github.event_name }}): ${{ steps.check.outputs.reason }}"
        run: |
          GH="$(command -v gh || echo /opt/homebrew/bin/gh)"
          "$GH" workflow run ml-pipeline.yml --ref "$GITHUB_REF_NAME" -f batch="$LABELLED" -f holdout="$RETRAIN_HOLDOUT" -f reason="$REASON" -f session="ct-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::notice title=Ciągły trening::uruchomiono ml-pipeline na $LABELLED"
