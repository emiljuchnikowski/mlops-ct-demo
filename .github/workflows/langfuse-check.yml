# Checks the Langfuse keys without printing them: key prefixes, stray whitespace and the API's answer.
name: langfuse-check

on: workflow_dispatch

permissions:
  contents: read

env:
  LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    runs-on: [self-hosted, ai-os-server]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci_env.sh
      - run: $PY -m mlpipe langfuse-check
      - name: Sessions and ratings in detail
        run: |
          $PY - <<'PY'
          from collections import Counter
          from mlpipe import tracking
          sessions = tracking._pages("/api/public/sessions?")
          print("sessions:", sorted(s["id"] for s in sessions))
          ratings = tracking._scores(tracking.FEEDBACK)
          print("feedback by trace prefix:", Counter("-".join(str(s.get("traceId", "")).split("-")[:2]) for s in ratings))
          PY
