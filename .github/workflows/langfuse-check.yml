# Checks the Langfuse keys without printing them: key prefixes, stray whitespace and the API's answer.
name: langfuse-check

on: workflow_dispatch

permissions:
  contents: read

env:
  LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    runs-on: [self-hosted, ai-os-server]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci_env.sh
      - run: $PY -m mlpipe langfuse-check
